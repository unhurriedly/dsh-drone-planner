<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>视锥航线 · 开发者模式</title>
<style>
:root{--ink:#172b59;--muted:#667798;--line:#e3e9f3;--blue:#4459f5;--soft:#eef0ff;--bg:#f7f9fd;--green:#159b79;--red:#d74e66}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
.dev-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-size:18px;font-weight:750;letter-spacing:-.3px}
.brand span{margin-left:10px;padding-left:12px;border-left:1px solid var(--line);color:var(--blue);font-size:14px;font-weight:600}
.dev-head p{margin:2px 0 0;color:var(--muted);font-size:12px}
.head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:12.5px;text-decoration:none}
.btn:hover{border-color:#8997fc;background:#f2f4ff;color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.06);background:var(--blue);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #abb5ff;outline-offset:2px}
.dev-main{display:grid;grid-template-columns:minmax(320px,380px) minmax(0,1fr);gap:16px;padding:16px 24px 26px;max-width:1900px;margin:0 auto;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:16px}
.card>h2{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}
.card-body{padding:14px 16px}
.field{display:block;margin:0 0 12px}
.field>span{display:block;margin-bottom:5px;color:var(--muted);font-size:12px}
.field input[type=text],.field input[type=number],.field select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.row3 .field{margin-bottom:6px}
.color-line{display:flex;gap:7px;align-items:center}
.color-line input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--line);border-radius:7px;background:#fff}
.color-line input[type=text]{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px}
.preset{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;color:var(--muted)}
.preset:hover{border-color:#8997fc;color:var(--blue)}
.preset i{width:10px;height:10px;border-radius:50%;display:block}
.slider-line{display:grid;grid-template-columns:1fr 72px;gap:9px;align-items:center}
.slider-line input[type=range]{padding:0;accent-color:var(--blue)}
.slider-line input[type=number]{padding:6px 8px}
.code-head{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.code-head h3{margin:0;font-size:12.5px;font-weight:600}
.code-head .hint{margin:0;font-size:11px;color:var(--muted)}
.code-head button{margin-left:auto}
pre.code{margin:0;padding:11px 12px;background:#0f1b33;color:#dbe4f7;border-radius:8px;font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;white-space:pre-wrap;word-break:break-all;max-height:220px}
.preview-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line);background:#fff}
.devices{display:flex;gap:5px}
.devices button{padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;color:var(--muted)}
.devices button.active{border-color:#a6b0ff;background:var(--soft);color:var(--blue);font-weight:600}
.preview-note{margin-left:auto;font-size:11.5px;color:var(--muted)}
.frame-wrap{padding:14px;background:#eef2fa;display:flex;justify-content:center}
#previewFrame{width:100%;height:min(78vh,860px);border:1px solid var(--line);border-radius:9px;background:#fff;transition:width .18s ease}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f335d;color:#fff;padding:11px 18px;border-radius:9px;font-size:12.5px;box-shadow:0 8px 25px #172b5920;z-index:20}
#toast[hidden]{display:none}
@media(max-width:1050px){.dev-main{grid-template-columns:1fr}}
@media(max-width:560px){.dev-main{padding:12px}.row3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="dev-head">
<div>
<div class="brand">视锥航线<span>开发者模式</span></div>
<p>调主题、字体、文案与尺寸，右侧实时预览；下方可直接复制安装、引用与 API 配置。</p>
</div>
<div class="head-actions">
<a class="btn" href="index.html">← 返回航线实验室</a>
<a class="btn primary" id="openPreview" href="index.html" target="_blank" rel="noopener">新标签打开预览</a>
</div>
</header>
<main class="dev-main">
<aside>
<section class="card">
<h2>可视化配置</h2>
<div class="card-body">
<div class="row3">
<label class="field"><span>主题色</span><span class="color-line"><input id="cfgAccent" type="color" value="#4459f5"><input id="cfgAccentHex" type="text" spellcheck="false" value="#4459f5" aria-label="主题色十六进制"></span></label>
<label class="field"><span>文字色</span><span class="color-line"><input id="cfgInk" type="color" value="#172b59"><input id="cfgInkHex" type="text" spellcheck="false" value="#172b59" aria-label="文字色十六进制"></span></label>
<label class="field"><span>背景色</span><span class="color-line"><input id="cfgBg" type="color" value="#f7f9fd"><input id="cfgBgHex" type="text" spellcheck="false" value="#f7f9fd" aria-label="背景色十六进制"></span></label>
</div>
<div class="presets" id="presets"></div>
<label class="field"><span>字体</span>
<select id="cfgFont">
<option value="">系统默认（-apple-system / PingFang SC）</option>
<option value="'PingFang SC','Microsoft YaHei',sans-serif">苹方 / 雅黑</option>
<option value="'Source Han Sans SC','Noto Sans SC',sans-serif">思源黑体</option>
<option value="'Songti SC',Georgia,serif">宋体 / 衬线</option>
<option value="ui-monospace,SFMono-Regular,Menlo,monospace">等宽</option>
</select>
</label>
<label class="field"><span>基础字号 / px</span>
<span class="slider-line"><input id="cfgSizeRange" type="range" min="12" max="18" step="1" value="14" aria-label="基础字号滑块"><input id="cfgSize" type="number" min="12" max="18" step="1" value="14" aria-label="基础字号"></span>
</label>
<label class="field"><span>画布高度 / px（尺寸）</span>
<span class="slider-line"><input id="cfgSceneRange" type="range" min="320" max="760" step="10" value="520" aria-label="画布高度滑块"><input id="cfgScene" type="number" min="320" max="760" step="10" value="520" aria-label="画布高度"></span>
</label>
<label class="field"><span>主标题文案</span><input id="cfgTitle" type="text" value="让视野覆盖目标" spellcheck="false"></label>
<label class="field" style="margin-bottom:0"><span>副标题文案</span><input id="cfgSubtitle" type="text" value="航线预设 · 沿线观察 · 逐点编辑 · 超视距实时裁切" spellcheck="false"></label>
</div>
</section>
<section class="card">
<h2>代码接入</h2>
<div class="card-body">
<div class="code-head"><h3>1. 安装</h3><button class="btn" data-copy="codeInstall" type="button">复制</button></div>
<pre class="code" id="codeInstall"></pre>
<div class="code-head"><h3>2. 引用代码</h3><span class="hint">iframe 嵌入，配置已编码进 URL</span><button class="btn" data-copy="codeIframe" type="button">复制</button></div>
<pre class="code" id="codeIframe"></pre>
<div class="code-head"><h3>3. API 配置</h3><span class="hint">已有页面内动态应用</span><button class="btn" data-copy="codeApi" type="button">复制</button></div>
<pre class="code" id="codeApi"></pre>
<div class="code-head"><h3>4. 当前配置 JSON</h3><button class="btn" data-copy="codeJson" type="button">复制</button></div>
<pre class="code" id="codeJson"></pre>
</div>
</section>
</aside>
<section class="card" style="margin:0">
<div class="preview-bar">
<div class="devices">
<button data-w="1280" class="active" type="button">桌面 1280</button>
<button data-w="1024" type="button">1024</button>
<button data-w="768" type="button">平板 768</button>
<button data-w="390" type="button">手机 390</button>
</div>
<button class="btn" id="reloadPreview" type="button">重新加载</button>
<a class="btn" id="openConfigured" href="index.html" target="_blank" rel="noopener">带配置新标签打开</a>
<span class="preview-note" id="previewNote">实时预览 · 与主页面同一份代码</span>
</div>
<div class="frame-wrap"><iframe id="previewFrame" src="index.html" title="航线实验室预览"></iframe></div>
</section>
</main>
<div id="toast" role="status" hidden></div>
<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  var frame=$('previewFrame'), note=$('previewNote');
  var cfg={accent:'#4459f5',ink:'#172b59',bg:'#f7f9fd',font:'',size:14,sceneH:520,title:'让视野覆盖目标',subtitle:'航线预设 · 沿线观察 · 逐点编辑 · 超视距实时裁切'};
  var PRESETS=[
    {name:'默认蓝',accent:'#4459f5',ink:'#172b59',bg:'#f7f9fd'},
    {name:'深墨',accent:'#2f6fd0',ink:'#0f1b33',bg:'#eef2f8'},
    {name:'森林',accent:'#159b79',ink:'#123330',bg:'#f2f8f5'},
    {name:'莓果',accent:'#a855ce',ink:'#2e1236',bg:'#f9f4fb'},
    {name:'琥珀',accent:'#c9781f',ink:'#3a2410',bg:'#fdf8f1'}
  ];
  function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.hidden=true},1800);}
  function b64(obj){
    var bytes=new TextEncoder().encode(JSON.stringify(obj)),bin='';
    for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function baseUrl(){return location.origin+location.pathname.replace(/dev\.html?$/,'').replace(/[^/]*$/,'');}
  function sendCfg(){if(!frame.contentWindow)return;frame.contentWindow.postMessage({type:'otp:config',cfg:cfg},'*');}
  function hex(id){return ($(id).value||'').trim()}
  function syncPair(colorId,hexId,key){
    var c=$(colorId),h=$(hexId);
    c.addEventListener('input',function(){h.value=c.value;cfg[key]=c.value;update()});
    h.addEventListener('change',function(){var v=h.value.trim();if(/^#[0-9a-fA-F]{6}$/.test(v)){c.value=v;cfg[key]=v;update();}else{h.value=cfg[key];toast('请输入 #RRGGBB 格式的颜色');}});
  }
  syncPair('cfgAccent','cfgAccentHex','accent');
  syncPair('cfgInk','cfgInkHex','ink');
  syncPair('cfgBg','cfgBgHex','bg');
  $('cfgFont').addEventListener('change',function(){cfg.font=this.value;update()});
  function linkPair(rangeId,numId,key){
    var r=$(rangeId),n=$(numId);
    r.addEventListener('input',function(){n.value=r.value;cfg[key]=+r.value;update()});
    n.addEventListener('change',function(){var v=Math.max(+n.min,Math.min(+n.max,+n.value||+n.min));n.value=v;r.value=v;cfg[key]=v;update()});
  }
  linkPair('cfgSizeRange','cfgSize','size');
  linkPair('cfgSceneRange','cfgScene','sceneH');
  $('cfgTitle').addEventListener('input',function(){cfg.title=this.value;update()});
  $('cfgSubtitle').addEventListener('input',function(){cfg.subtitle=this.value;update()});
  // preset chips
  var wrap=$('presets');
  PRESETS.forEach(function(p){
    var b=document.createElement('button');b.type='button';b.className='preset';
    b.innerHTML='<i style="background:'+p.accent+'"></i>'+p.name;
    b.addEventListener('click',function(){
      cfg.accent=p.accent;cfg.ink=p.ink;cfg.bg=p.bg;
      $('cfgAccent').value=p.accent;$('cfgAccentHex').value=p.accent;
      $('cfgInk').value=p.ink;$('cfgInkHex').value=p.ink;
      $('cfgBg').value=p.bg;$('cfgBgHex').value=p.bg;
      update();
    });
    wrap.appendChild(b);
  });
  function renderCode(){
    var embed=baseUrl(),url=embed+'?cfg='+b64(cfg);
    $('codeInstall').textContent='# 方式一：本地目录安装（Harness 插件）\nplugin_manager install_bundle /path/to/dsh-drone-planner\n\n# 方式二：从 GitHub 克隆后安装\ngit clone https://github.com/unhurriedly/dsh-drone-planner.git\nplugin_manager install_bundle ./dsh-drone-planner\n\n# 自检\ncurl -I '+embed;
    $('codeIframe').textContent='<iframe\n  src="'+url+'"\n  width="100%" height="900"\n  style="border:0"\n  title="视锥航线"></iframe>';
    $('codeApi').textContent='<script src="'+embed+'api.js"><\/script>\n<script>\n  window.OttoPlexDronePlanner.init('+JSON.stringify(cfg,null,2).replace(/\n/g,'\n  ')+');\n<\/script>\n\n// 已加载页面内动态应用：\n// window.OttoPlexDronePlanner.apply({ accent: "#159b79" });';
    $('codeJson').textContent=JSON.stringify(cfg,null,2);
    $('openConfigured').href=url;
  }
  function update(){sendCfg();renderCode();note.textContent='已应用 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false});}
  frame.addEventListener('load',function(){sendCfg();});
  $('reloadPreview').addEventListener('click',function(){frame.src='index.html?t='+Date.now();});
  document.querySelectorAll('.devices button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.devices button').forEach(function(x){x.classList.remove('active')});
      b.classList.add('active');
      var w=+b.dataset.w;
      frame.style.width=w>=1100?'100%':w+'px';
      frame.style.maxWidth='100%';
    });
  });
  document.addEventListener('click',function(e){
    var btn=e.target.closest('[data-copy]');if(!btn)return;
    var text=$(btn.dataset.copy).textContent;
    var done=function(){toast('已复制到剪贴板');};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fallback);}else fallback();
    function fallback(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(err){toast('复制失败，请手动选择');}document.body.removeChild(ta);}
  });
  renderCode();
  window.OttoPlexDev={getConfig:function(){return cfg;},apply:function(partial){Object.assign(cfg,partial);update();}};
})();
</script>
</body>
</html>
