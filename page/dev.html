<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>智飞航线规划 · 开发者模式</title>
<style>
:root{--ink:#172b59;--muted:#667798;--line:#e3e9f3;--blue:#4459f5;--soft:#eef0ff;--bg:#f7f9fd;--red:#c0324d;--green:#159b79}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
.dev-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:15px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-size:18px;font-weight:750;letter-spacing:-.3px}
.brand span{margin-left:10px;padding-left:12px;border-left:1px solid var(--line);color:var(--blue);font-size:14px;font-weight:600}
.dev-head p{margin:2px 0 0;color:var(--muted);font-size:12px}
.head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:12.5px;text-decoration:none}
.btn:hover{border-color:#8997fc;background:#f2f4ff;color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.06);background:var(--blue);color:#fff}
.btn:focus-visible,button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #abb5ff;outline-offset:2px}
.tabs{display:flex;gap:6px;padding:12px 24px 0;max-width:1900px;margin:0 auto}
.tab{padding:8px 15px;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;background:#eef2fa;color:var(--muted);font-size:13px;font-weight:600}
.tab.active{background:#fff;color:var(--blue);border-color:var(--line);box-shadow:0 -2px 0 var(--blue) inset}
.tab-panel{display:none;max-width:1900px;margin:0 auto;padding:0 24px 26px}
.tab-panel.active{display:block}
.shell{background:#fff;border:1px solid var(--line);border-radius:0 11px 11px 11px;padding:16px}
.cols{display:grid;grid-template-columns:minmax(340px,1fr) minmax(340px,1fr);gap:16px;align-items:start}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.card>h2{margin:0;padding:13px 15px;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;align-items:center;gap:8px}
.card>h2 .hint{margin-left:auto;font-weight:400;font-size:11px;color:var(--muted)}
.card-body{padding:13px 15px}
.field{display:block;margin:0 0 12px}
.field>span{display:block;margin-bottom:5px;color:var(--muted);font-size:12px}
#cfgCode{width:100%;min-height:340px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#0f1b33;color:#dbe4f7;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;tab-size:2}
#cfgStatus{margin:8px 0 0;font-size:11.5px;color:var(--muted)}
#cfgStatus.bad{color:var(--red);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.code-head{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.code-head:first-child{margin-top:0}
.code-head h3{margin:0;font-size:12.5px;font-weight:600}
.code-head .hint{margin:0;font-size:11px;color:var(--muted);flex:1;min-width:0}
pre.code{margin:0;padding:11px 12px;background:#0f1b33;color:#dbe4f7;border-radius:8px;font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;white-space:pre-wrap;word-break:break-all;max-height:210px}
.preview-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.devices{display:flex;gap:5px}
.devices button{padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;color:var(--muted)}
.devices button.active{border-color:#a6b0ff;background:var(--soft);color:var(--blue);font-weight:600}
.preview-note{margin-left:auto;font-size:11.5px;color:var(--muted)}
.frame-wrap{background:#eef2fa;border-radius:10px;padding:12px;display:flex;justify-content:center}
#previewFrame{width:100%;height:min(80vh,900px);border:1px solid var(--line);border-radius:9px;background:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f335d;color:#fff;padding:11px 18px;border-radius:9px;font-size:12.5px;box-shadow:0 8px 25px #172b5920;z-index:20}
#toast[hidden]{display:none}
@media(max-width:1080px){.cols{grid-template-columns:1fr}}
@media(max-width:560px){.dev-head,.tabs,.tab-panel{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<header class="dev-head">
<div>
<div class="brand">智飞航线规划<span>开发者模式</span></div>
</div>
<div class="head-actions">
<a class="btn primary" id="openOfficial" href="index.html" target="_blank" rel="noopener" title="在新标签页打开正式页面 page/index.html">正式页面</a>
</div>
</header>
<nav class="tabs" role="tablist">
<button class="tab active" type="button" role="tab" aria-selected="true" data-tab="config">开发配置</button>
<button class="tab" type="button" role="tab" aria-selected="false" data-tab="preview">实时预览</button>
</nav>
<section class="tab-panel active" id="panel-config" role="tabpanel">
<div class="shell">
<div class="cols">
<section class="card">
<h2>开发配置<span class="hint">前端代码方式维护</span></h2>
<div class="card-body">
<label class="field" style="margin-bottom:0"><span>配置代码（JS 对象，输入即生效）</span>
<textarea id="cfgCode" spellcheck="false" aria-label="配置代码"></textarea>
</label>
<p id="cfgStatus" role="status">已应用</p>
<div class="row">
<button class="btn" id="resetConfig" type="button">恢复默认</button>
<button class="btn" id="copyConfig" type="button">复制配置代码</button>
</div>
</div>
</section>
<section class="card">
<h2>代码接入<span class="hint">安装 · 引用 · API</span></h2>
<div class="card-body">
<div class="code-head"><h3>1. 安装</h3><button class="btn" data-copy="codeInstall" type="button">复制</button></div>
<pre class="code" id="codeInstall"></pre>
<div class="code-head"><h3>2. 引用代码</h3><span class="hint">iframe，配置已编码进 URL</span><button class="btn" data-copy="codeIframe" type="button">复制</button></div>
<pre class="code" id="codeIframe"></pre>
<div class="code-head"><h3>3. API 配置</h3><span class="hint">挂载与热更新</span><button class="btn" data-copy="codeApi" type="button">复制</button></div>
<pre class="code" id="codeApi"></pre>
</div>
</section>
</div>
</div>
</section>
<section class="tab-panel" id="panel-preview" role="tabpanel">
<div class="shell">
<div class="preview-bar">
<div class="devices">
<button data-w="1280" class="active" type="button">桌面 1280</button>
<button data-w="1024" type="button">1024</button>
<button data-w="768" type="button">平板 768</button>
<button data-w="390" type="button">手机 390</button>
</div>
<button class="btn" id="reloadPreview" type="button">重新加载</button>
<span class="preview-note" id="previewNote">切换回预览时自动重绘</span>
</div>
<div class="frame-wrap"><iframe id="previewFrame" src="index.html" title="航线实验室预览"></iframe></div>
</div>
</section>
<div id="toast" role="status" hidden></div>
<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  var frame=$('previewFrame');
  var DEFAULTS={accent:'#4459f5',ink:'#172b59',bg:'#f7f9fd',font:'',size:14,sceneH:520,title:'智飞航线规划',subtitle:'航线让无人机视野覆盖目标区域'};
  var cfg=Object.assign({},DEFAULTS);

  var DEFAULT_CODE=[
    '// 智飞航线规划 · 页面配置（可直接维护在你的前端代码里）',
    '// 修改后即时应用到右侧预览；也可复制到宿主页面调用 OttoPlexDronePlanner.init()',
    'const config = {',
    "  accent: '#4459f5',        // 主题色",
    "  ink: '#172b59',           // 文字色",
    "  bg: '#f7f9fd',            // 页面背景色",
    "  font: '',                 // 字体族，留空为系统默认",
    '  size: 14,                 // 基础字号 px',
    '  sceneH: 520,              // 画布高度 px（尺寸）',
    "  title: '智飞航线规划',     // 主标题文案",
    "  subtitle: '航线让无人机视野覆盖目标区域'",
    '};'
  ].join('\n');

  function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.hidden=true},1800);}
  function b64(obj){
    var bytes=new TextEncoder().encode(JSON.stringify(obj)),bin='';
    for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function baseUrl(){return location.origin+location.pathname.replace(/dev\.html?$/,'').replace(/[^/]*$/,'');}
  function parseCode(text){
    var m=text.match(/\{[\s\S]*\}/);
    if(!m)throw new Error('未找到配置对象 { … }');
    var value=new Function('"use strict";return ('+m[0]+');')();
    if(!value||typeof value!=='object'||Array.isArray(value))throw new Error('配置需要是一个对象');
    return value;
  }
  function status(text,bad){var el=$('cfgStatus');el.textContent=text;el.className=bad?'bad':'';}
  function sendCfg(){if(frame.contentWindow)frame.contentWindow.postMessage({type:'otp:config',cfg:cfg},'*');}
  function renderCode(){
    var embed=baseUrl(),url=embed+'?cfg='+b64(cfg);
    $('codeInstall').textContent='# 方式一：Harness 插件本地目录安装\nplugin_manager install_bundle /path/to/dsh-drone-planner\n\n# 方式二：从 GitHub 克隆后安装\ngit clone https://github.com/unhurriedly/dsh-drone-planner.git\nplugin_manager install_bundle ./dsh-drone-planner\n\n# 自检\ncurl -I '+embed;
    $('codeIframe').textContent='<iframe\n  src="'+url+'"\n  width="100%" height="900"\n  style="border:0"\n  title="智飞航线规划"></iframe>';
    $('codeApi').textContent='<div id="drone"></div>\n<script src="'+embed+'api.js"><\/script>\n<script>\n  var app = OttoPlexDronePlanner.mount("#drone", '+JSON.stringify(cfg,null,2).replace(/\n/g,'\n  ')+');\n  app.apply({ title: "新的标题" }); // 不重载即可热更新\n<\/script>';
  }
  function applyCode(){
    var text=$('cfgCode').value;
    try{
      var parsed=parseCode(text);
      cfg=Object.assign({},DEFAULTS,parsed);
      sendCfg();renderCode();
      status('已应用 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false}));
    }catch(error){
      status('解析失败：'+error.message+'（预览保持上一次有效配置）',true);
    }
  }
  var timer=null;
  $('cfgCode').addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(applyCode,350);});
  $('resetConfig').addEventListener('click',function(){$('cfgCode').value=DEFAULT_CODE;applyCode();});
  $('copyConfig').addEventListener('click',function(){copyText($('cfgCode').value);});
  // tabs
  document.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b===btn);b.setAttribute('aria-selected',b===btn?'true':'false');});
      document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.toggle('active',p.id==='panel-'+(btn.dataset.tab==='preview'?'preview':'config'));});
      if(btn.dataset.tab==='preview'){
        try{frame.contentWindow.dispatchEvent(new frame.contentWindow.Event('resize'));}catch(error){}
        sendCfg();
      }
    });
  });
  frame.addEventListener('load',function(){sendCfg();});
  $('reloadPreview').addEventListener('click',function(){frame.src='index.html?t='+Date.now();});
  document.querySelectorAll('.devices button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.devices button').forEach(function(x){x.classList.remove('active')});
      b.classList.add('active');
      var w=+b.dataset.w;
      frame.style.width=w>=1100?'100%':w+'px';
      frame.style.maxWidth='100%';
    });
  });
  function copyText(text){
    var done=function(){toast('已复制到剪贴板');};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fallback);}else fallback();
    function fallback(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(error){toast('复制失败，请手动选择');}document.body.removeChild(ta);}
  }
  document.addEventListener('click',function(e){
    var btn=e.target.closest('[data-copy]');if(!btn)return;
    copyText($(btn.dataset.copy).textContent);
  });
  $('cfgCode').value=DEFAULT_CODE;
  renderCode();
  window.OttoPlexDev={getConfig:function(){return cfg;},setCode:function(code){$('cfgCode').value=code;applyCode();},applyCode:applyCode};
})();
</script>
</body>
</html>
